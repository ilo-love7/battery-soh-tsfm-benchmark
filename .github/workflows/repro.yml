name: repro

# 复现门禁（§9.7）。守的不是新结论，而是两条已经验证过的性质：
#   1. 从干净克隆跑汇总链，已提交的图与汇总产物不被改动；
#   2. 全部回归测试通过、文档没有断链。
#
# ⚠️ 图的比对用**像素级**而不是 MD5：图是在 Windows 上生成的，CI 跑在 Linux，
# FreeType / zlib 版本不同会让 PNG 字节必然不同（实测 14/14 张 MD5 都变），
# 但像素通常不变。同平台复现才要求字节级一致——那条性质在作者机器上
# 用 `python scripts/check_figures.py`（默认字节级）验证。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # matplotlib 钉在 3.11.2：图的**内容**由它决定，版本漂移会让像素也变。
      # pillow 只用于图比对时解码 PNG，不参与出图。
      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "matplotlib==3.11.2" pillow
          python -m pip install -q -r requirements-core.txt
          python -c "import matplotlib,numpy,pandas,scipy,sklearn,PIL;print(
            'matplotlib',matplotlib.__version__,'| numpy',numpy.__version__,
            '| pandas',pandas.__version__,'| scipy',scipy.__version__,
            '| sklearn',sklearn.__version__,'| pillow',PIL.__version__)"

      - name: 语法检查 + 回归测试
        run: |
          python -m compileall -q 01_源代码
          cd 01_源代码
          for t in test_prob_metrics test_calibrated test_cache_fingerprint \
                   test_online_proxy test_conformal_w; do
            echo "== $t =="
            python "tests/$t.py" || exit 1
          done

      - name: 文档一致性（相对链接 + 目录锚点）
        run: python scripts/check_docs.py

      # 汇总链 22 步。CI 上没有原始数据集，4 个需要数据的步骤会打印
      # "[跳过]" 并以 0 退出（SOFT_MISSING_DATA=1，见 run_matrix.sh）；
      # 其余步骤只读 03_实验结果，任何一步失败都会让整条链返回非零。
      - name: 汇总链（22 步）
        env:
          PY_CORE: python
        run: bash scripts/run_matrix.sh report

      # 图与已提交版本逐张比像素（跨平台口径）。像素不变 ⇒ 只是编码差异；
      # 像素也变 ⇒ 渲染栈不同或数据真的变了，需要人工判断。
      - name: 图与已提交版本一致（像素级）
        run: python scripts/check_figures.py --pixels

      # 文本产物（.md / .csv / .json）跨平台是确定的，要求一个字节都不变。
      # figures/ 排除在外：Linux 上重画的 PNG 字节必然不同（FreeType/zlib
      # 编码栈差异），它的等价性由上一步按像素断言。
      - name: 汇总产物未被改动（文本）
        run: |
          if git diff --exit-code -- . ':(exclude)04_文档报告/figures/'; then
            echo "OK：汇总链改写的文本产物与已提交的一致"
          else
            echo "::error::汇总链改写了已提交产物（见上方 diff）"
            git diff --stat
            exit 1
          fi
